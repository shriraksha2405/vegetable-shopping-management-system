{% extends "base.html" %}{% block content %}<div class="formbox wide"><h2>Checkout & Payment</h2><p>Order total: <b>₹{{'%.2f'|format(total)}}</b></p><form method="post" novalidate><textarea name="address" placeholder="House / street / area" required>{{user.address or ""}}</textarea><input name="delivery_location" value="{{user.delivery_location or ''}}" placeholder="Delivery location / city" required><input name="pincode" value="{{user.pincode or ''}}" placeholder="6-digit PIN code" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6"><input name="phone" value="{{user.phone or ''}}" placeholder="10-digit contact number" required inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10"><select name="payment_method"><option>Cash on Delivery</option><option>UPI</option><option>Card</option></select><p class="note">UPI/Card are simulated for this student project. Never enter a real card number, CVV or UPI PIN here.</p><button>Place Order & Pay</button></form></div>{% endblock %}
