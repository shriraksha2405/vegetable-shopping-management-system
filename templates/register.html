{% extends "base.html" %}{% block content %}<div class="formbox"><h2>Customer Registration</h2><form method="post" novalidate><input name="name" placeholder="Full name" required><input type="email" name="email" placeholder="Email (name@example.com)" required pattern="[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$"><input name="phone" placeholder="10-digit phone number" required inputmode="numeric" pattern="[6-9][0-9]{9}" maxlength="10"><input type="password" name="password" placeholder="Password (minimum 8 characters)" required minlength="8"><small>Password must contain at least 8 characters.</small><button>Create Account</button></form></div>{% endblock %}
