{% extends "base.html" %}{% block content %}<h2>Manage Vegetables</h2><a class="button" href="{{url_for('admin_add_vegetable')}}">+ Add Vegetable</a><table><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr>{% for v in vegetables %}<tr><td>{% if v.image %}<img class="admin-veg-thumb" src="{{ url_for('static', filename='images/' + v.image) }}" alt="{{v.name}}">{% endif %}</td><td>{{v.name}}</td><td>{{v.category}}</td><td>₹{{v.price}}</td><td>{{v.stock}} kg</td><td><a href="{{url_for('admin_edit_vegetable',vid=v.id)}}">Edit</a> <form class="inline" method="post" action="{{url_for('admin_delete_vegetable',vid=v.id)}}"><button class="danger">Delete</button></form></td></tr>{% endfor %}</table>{% endblock %}
