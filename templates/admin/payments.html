{% extends "base.html" %}{% block content %}<h2>Payment Details</h2><table><tr><th>Order</th><th>Customer</th><th>Amount</th><th>Method</th><th>Status</th><th>Transaction ID</th><th>Date</th></tr>{% for p in payments %}<tr><td>#{{p.order_id}}</td><td>{{p.customer}}</td><td>₹{{p.amount}}</td><td>{{p.payment_method}}</td><td>{{p.payment_status}}</td><td>{{p.transaction_id or "COD"}}</td><td>{{p.payment_date}}</td></tr>{% endfor %}</table>{% endblock %}
