{% extends "base.html" %}{% block content %}<h2>All Orders</h2><table><tr><th>Order</th><th>Customer</th><th>Total</th><th>Payment</th><th>Status</th></tr>{% for o in orders %}<tr><td>#{{o.id}}</td><td>{{o.customer}}</td><td>₹{{o.total_amount}}</td><td>{{o.payment_method}} / {{o.payment_status}}<br>{{o.transaction_id or "COD"}}</td><td><form method="post" action="{{url_for('admin_order_status',oid=o.id)}}"><select name="status"><option {% if o.status=="Pending" %}selected{% endif %}>Pending</option><option {% if o.status=="Confirmed" %}selected{% endif %}>Confirmed</option><option {% if o.status=="Delivered" %}selected{% endif %}>Delivered</option><option {% if o.status=="Cancelled" %}selected{% endif %}>Cancelled</option></select><button>Update</button></form></td></tr>{% endfor %}</table>{% endblock %}
