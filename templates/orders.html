{% extends "base.html" %}{% block content %}<h2>My Orders</h2><table><tr><th>Order</th><th>Total</th><th>Order Status</th><th>Payment</th><th>Transaction</th></tr>{% for o in orders %}<tr><td>#{{o.id}}<br>{{o.order_date}}</td><td>₹{{o.total_amount}}</td><td>{{o.status}}</td><td>{{o.payment_method}}<br>{{o.payment_status}}</td><td>{{o.transaction_id or "COD"}}</td></tr>{% else %}<tr><td colspan="5">No orders.</td></tr>{% endfor %}</table>{% endblock %}
